name: Project OS
slug: project-os
type: folder
version: 1.0.0
author: Palette
description: >-
  A single project as a file system — one folder your whole team, your client, and every
  AI agent work from. Context, meetings, decisions, research, design, deliverables, and how
  the team works, all in plain markdown, plus a live status dashboard (overview.html)
  generated from your files. Ships pre-filled with a sample project so it works on first
  open; /onboard replaces it with yours.
logo: logo.png
tags: [project, project-management, client, agency, consulting, dashboard, workspace]
license: MIT

requires:
  palette_desktop: ">=0.5"

notes: |
  The installing agent runs /onboard automatically as the last install step, replacing the
  sample project with your real one — you don't have to trigger it. If it doesn't finish,
  SETUP.md keeps the open boxes and any agent picks it up next session; you can also say
  "set me up" (or run /onboard) to resume, and it's safe to re-run. Open overview.html for
  the live dashboard. Log decisions with /new-decision, meetings with /new-meeting, and wrap
  up sessions with /finish-session.
