name: GTM OS
slug: gtm-os
type: folder
version: 1.1.5
author: Palette
description: >-
  Your go-to-market as a file system: brand, market, strategy, playbooks, accounts, team
  context, and active work in one folder of Markdown. Your team and different supported agents
  can work from the same GTM context, instructions, and history.
logo: logo.png
tags: [gtm, sales, marketing, brand, content, workspace]
license: MIT

requires:
  palette_desktop: ">=0.5"

notes: |
  After install, say "set me up" to add your company, product, brand, and
  team. Bring in connected context, drop existing documents into _inbox,
  paste useful context from another AI tool, or answer one short round of
  questions.
