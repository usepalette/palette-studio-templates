name: Product OS
slug: product-os
type: folder
version: 1.0.6
author: Palette
description: >-
  Your product work as a file system: user feedback, pain points, feature requests, discovery,
  strategy, specs, competitors, and team input in one folder of Markdown. Your team and
  different supported agents can work from the same product evidence and decisions while
  projects stay in the issue tracker.
logo: logo.png
tags: [product, user-feedback, discovery, strategy, specs, roadmap, workspace]
license: MIT

requires:
  palette_desktop: ">=0.5"

notes: |
  After install, say "set me up" to adapt Product OS to the product scope,
  people, folders, sources, and tools you actually use. Bring in connected
  context, drop documents into _inbox, paste useful context from another AI
  tool, or answer one short round of questions. A solo setup and optional
  integrations are supported.
